# ==============================================================================
# Ambulance Dispatch System Configuration
# ==============================================================================

spring.application.name=ambulance-dispatch

# Database Connection (MySQL)
# NOTE: Replace 'root' below with your actual local MySQL password.
# If your MySQL root account has no password, leave it empty: spring.datasource.password=
spring.datasource.url=jdbc:mysql://localhost:3306/ambulance_dispatch_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=toor
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf Template Engine Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Server Port
server.port=8080